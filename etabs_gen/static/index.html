<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETABS Generator de modele</title>
<style>
  :root { --bg:#faf9f5; --surface:#fff; --text:#141413; --muted:#6b6a63; --border:#e5e2d6; --accent:#c96442; --accent-text:#fff; --ok:#46592f; --err:#9c2f20; }
  @media (prefers-color-scheme: dark) { :root { --bg:#262624; --surface:#30302e; --text:#faf9f5; --muted:#a8a69c; --border:#46443f; --accent:#d97757; --ok:#a5c283; --err:#e58b7a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Inter",system-ui,Segoe UI,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font:600 24px/1.2 Georgia,"Lora",serif; margin:0 0 4px; }
  h2 { font:600 17px Georgia,serif; margin:0 0 10px; }
  .muted { color:var(--muted); font-size:13px; }
  section { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin:16px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  label { display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); }
  input, select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  button { font:inherit; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:8px; padding:7px 14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-text); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.on { background:var(--ok); }
  #msg { margin-top:10px; white-space:pre-wrap; }
  .err { color:var(--err); } .okc { color:var(--ok); }
  ul { padding-left:18px; margin:6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Generator de modele ETABS</h1>
  <p class="muted">Creează modele de test pentru verificator. Pornește o instanță ETABS nouă; instanțele tale deschise nu sunt atinse.</p>

  <section>
    <h2>1. ETABS</h2>
    <div class="row">
      <span class="dot" id="dot"></span><span id="state">se verifică…</span>
      <button class="primary" id="open">Deschide ETABS nou</button>
      <button id="close">Închide</button>
    </div>
  </section>

  <section>
    <h2>2. Structură în cadre</h2>
    <div class="grid" id="form"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="build" disabled>Creează modelul</button>
      <span class="muted" id="hint">Pornește mai întâi ETABS.</span>
    </div>
    <div id="msg"></div>
  </section>

  <section>
    <h2>Modele create</h2>
    <ul id="models"><li class="muted">Niciunul încă.</li></ul>
  </section>
</main>
<script>
const FIELDS = [
  ["name","Nume model","text"],["stories","Etaje (x)","number"],["bays","Deschideri (y, pe X)","number"],["travei","Travei (z, pe Y)","number"],
  ["story_height","Înălțime etaj (m)","number"],["span_x","Deschidere (m)","number"],["span_y","Travee (m)","number"],
  ["column_b","Stâlp lățime (m)","number"],["column_h","Stâlp înălțime (m)","number"],["beam_b","Grindă lățime (m)","number"],["beam_h","Grindă înălțime (m)","number"],
  ["slab_t","Grosime placă (m)","number"],["concrete","Clasa betonului","select"],["dead_extra","Permanent suplimentar (kN/m²)","number"],
  ["live","Utilă (kN/m²)","number"],["diaphragm","Diafragmă","select"]
];
const $ = (id) => document.getElementById(id);
let defaults = null;

async function api(url, body) {
  const r = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function say(text, cls = "") { $("msg").className = cls; $("msg").textContent = text; }

function renderForm(spec) {
  $("form").innerHTML = "";
  for (const [key, label, type] of FIELDS) {
    const l = document.createElement("label"); l.textContent = label;
    let el;
    if (type === "select") {
      el = document.createElement("select");
      const opts = key === "concrete" ? defaults.concrete : ["semirigid", "rigid"];
      for (const o of opts) el.add(new Option(o, o));
    } else { el = document.createElement("input"); el.type = type; if (type === "number") el.step = "any"; }
    el.id = "f_" + key; el.value = spec[key]; l.append(el); $("form").append(l);
  }
}
function readSpec() {
  const s = {};
  for (const [key, , type] of FIELDS) { const v = $("f_" + key).value; s[key] = type === "number" ? Number(v) : v; }
  return s;
}
function renderModels(models) {
  $("models").innerHTML = models.length ? "" : '<li class="muted">Niciunul încă.</li>';
  for (const m of models) {
    const li = document.createElement("li");
    li.textContent = `${m.name}: ${m.objects.stalpi} stâlpi, ${m.objects.grinzi} grinzi, ${m.objects.placi} plăci — ${m.file}`;
    $("models").append(li);
  }
}
async function refresh() {
  const s = await api("/api/status");
  $("dot").className = "dot" + (s.open ? " on" : "");
  $("state").textContent = s.open ? `ETABS pornit (v${s.version})${s.file ? " · " + s.file : ""}` : "ETABS nu este pornit";
  $("build").disabled = !s.open; $("close").disabled = !s.open; $("open").disabled = s.open;
  $("hint").textContent = s.open ? "Modelul se salvează în folderul generated_models." : "Pornește mai întâi ETABS.";
}
$("open").onclick = async () => {
  $("open").disabled = true; say("Se pornește ETABS (poate dura ~1 minut)…");
  try { const r = await api("/api/open", {}); say(r.already ? "ETABS era deja pornit." : `ETABS pornit în ${r.seconds} s.`, "okc"); }
  catch (e) { say(e.message, "err"); }
  await refresh();
};
$("close").onclick = async () => { try { await api("/api/close", {}); say("ETABS închis."); } catch (e) { say(e.message, "err"); } await refresh(); };
$("build").onclick = async () => {
  $("build").disabled = true; say("Se creează modelul…");
  try {
    const r = await api("/api/build/frames", { spec: readSpec() });
    say(`Gata în ${r.seconds} s: ${r.objects.stalpi} stâlpi, ${r.objects.grinzi} grinzi, ${r.objects.placi} plăci.\nSalvat: ${r.file}`, "okc");
    renderModels((await api("/api/defaults")).models);
  } catch (e) { say(e.message, "err"); }
  await refresh();
};
(async () => { defaults = await api("/api/defaults"); renderForm(defaults.spec); renderModels(defaults.models); await refresh(); })();
</script>
</body>
</html>
